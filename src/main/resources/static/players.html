<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh {
            background: #008cff;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1c1c1c;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #333;
            text-align: center;
        }

        th {
            background: #222;
        }

        tr:nth-child(even) {
            background: #181818;
        }

        tr:hover {
            background: #252525;
        }

        .alive {
            color: #00ff88;
            font-weight: bold;
        }

        .dead {
            color: #ff4444;
            font-weight: bold;
        }

        .edit {
            background: #ffaa00;
            color: black;
            margin-right: 5px;
        }

        .toggle {
            background: #444;
            color: white;
        }

        .team {
            font-weight: bold;
        }

        .loading {
            padding: 30px;
            text-align: center;
        }

        .error {
            color: #ff4444;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 900px) {

            body {
                padding: 10px;
                overflow-x: auto;
            }

            table {
                min-width: 900px;
            }

        }

    </style>

</head>

<body>

    <h1>🎮 PLAYER DASHBOARD</h1>

    <div class="subtitle">
        16 Teams • 64 Players
    </div>

    <div class="controls">

        <button class="refresh" onclick="loadPlayers()">
            🔄 Refresh Players
        </button>

    </div>

    <table>

        <thead>

            <tr>

                <th>Player</th>
                <th>Team</th>
                <th>Status</th>
                <th>Kills</th>
                <th>Headshots</th>
                <th>Damage</th>
                <th>Assists</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="players">

            <tr>

                <td colspan="8" class="loading">
                    Loading players...
                </td>

            </tr>

        </tbody>

    </table>


    <script>

        const API_URL = "/api/players";


        // ==========================================
        // LOAD PLAYERS
        // ==========================================

        async function loadPlayers() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {

                    throw new Error(
                        "Server returned " + response.status
                    );

                }

                const players = await response.json();

                displayPlayers(players);

            }

            catch (error) {

                console.error(error);

                document.getElementById("players").innerHTML = `

                    <tr>

                        <td colspan="8" class="error">

                            ❌ Unable to load players

                        </td>

                    </tr>

                `;

            }

        }


        // ==========================================
        // DISPLAY PLAYERS
        // ==========================================

        function displayPlayers(players) {

            const table =
                document.getElementById("players");

            table.innerHTML = "";


            players.forEach(player => {

                const row =
                    document.createElement("tr");


                const status =
                    player.alive
                        ? "🟢 ALIVE"
                        : "🔴 DEAD";


                const statusClass =
                    player.alive
                        ? "alive"
                        : "dead";


                row.innerHTML = `

                    <td>
                        <strong>${player.name}</strong>
                    </td>

                    <td class="team">
                        ${player.teamName}
                    </td>

                    <td class="${statusClass}">
                        ${status}
                    </td>

                    <td>
                        ${player.kills}
                    </td>

                    <td>
                        ${player.headshots}
                    </td>

                    <td>
                        ${player.damage}
                    </td>

                    <td>
                        ${player.assists}
                    </td>

                    <td>

                        <button
                            class="edit"
                            onclick="editPlayer('${player.name}')">

                            ✏️ Edit

                        </button>

                        <button
                            class="toggle"
                            onclick="togglePlayer('${player.name}')">

                            ${player.alive ? "💀 Kill" : "❤️ Revive"}

                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }


        // ==========================================
        // EDIT PLAYER
        // ==========================================

        async function editPlayer(name) {

            const kills =
                prompt("Enter kills:");


            if (kills === null) {
                return;
            }


            const headshots =
                prompt("Enter headshots:");


            if (headshots === null) {
                return;
            }


            const damage =
                prompt("Enter damage:");


            if (damage === null) {
                return;
            }


            const assists =
                prompt("Enter assists:");


            if (assists === null) {
                return;
            }


            const playerData = {

                kills: Number(kills),

                headshots: Number(headshots),

                damage: Number(damage),

                assists: Number(assists)

            };


            try {

                const response =
                    await fetch(
                        `${API_URL}/${name}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(playerData)
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Update failed"
                    );

                }


                alert(
                    "Player updated successfully!"
                );


                loadPlayers();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Failed to update player."
                );

            }

        }


        // ==========================================
        // KILL / REVIVE
        // ==========================================

        async function togglePlayer(name) {

            try {

                const response =
                    await fetch(
                        `${API_URL}/${name}/toggle`,
                        {
                            method: "PUT"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Toggle failed"
                    );

                }


                loadPlayers();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Failed to change player status."
                );

            }

        }


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        loadPlayers();


        // ==========================================
        // AUTO REFRESH
        // ==========================================

        setInterval(
            loadPlayers,
            3000
        );

    </script>

</body>

</html>
